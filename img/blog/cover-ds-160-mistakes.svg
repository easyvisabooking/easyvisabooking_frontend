<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img"
     aria-labelledby="cds160mistakes-title cds160mistakes-desc" font-family="Poppins, 'Segoe UI', Helvetica, Arial, sans-serif">
  <title id="cds160mistakes-title">The DS-160 errors that cost time are the ones that break the link between the form and the appointment</title>
  <desc id="cds160mistakes-desc">A submitted DS-160 cannot be edited. Correcting an error means completing a new form, which generates a new confirmation number, and your appointment is tied to the old one. Since December 2025 applicants who submit a second DS-160 are advised to bring both confirmation pages to the interview, otherwise the appointment may need rescheduling under the new number. The other high-cost errors are a failed photo upload, a mistyped SEVIS ID, and passport or date of birth typos.</desc>

  <defs>
    <linearGradient id="cds160mistakes-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2C2237"/>
      <stop offset="55%" stop-color="#43305A"/>
      <stop offset="100%" stop-color="#5B4180"/>
    </linearGradient>
    <linearGradient id="cds160mistakes-fade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity=".10"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#cds160mistakes-bg)"/>
  <rect width="1200" height="630" fill="url(#cds160mistakes-fade)"/>

  <text x="140" y="196" fill="#C6B0E8" font-size="22" font-weight="600" letter-spacing="3.2">THE COSTLY ERRORS ARE ADMINISTRATIVE</text>

  <text x="136" y="300" fill="#ffffff" font-size="64" font-weight="600" letter-spacing="-2">A new form means</text>
  <text x="136" y="362" fill="#ffffff" font-size="64" font-weight="600" letter-spacing="-2">a new number</text>
  <rect x="140" y="390" width="86" height="5" rx="2.5" fill="#E02454"/>

  <line x1="140" y1="452" x2="1060" y2="452" stroke="#ffffff" stroke-opacity=".18" stroke-width="1"/>
  <line x1="140" y1="544" x2="1060" y2="544" stroke="#ffffff" stroke-opacity=".18" stroke-width="1"/>

  <g font-size="21" font-weight="500">
    <text x="140" y="492" fill="#C6B0E8">Cannot be edited</text>
    <text x="140" y="524" fill="#ffffff">A submitted DS-160 is final</text>
    <text x="560" y="492" fill="#C6B0E8">A correction means</text>
    <text x="560" y="524" fill="#ffffff">A new confirmation number</text>
    <text x="140" y="576" fill="#C6B0E8">Since December 2025</text>
    <text x="140" y="608" fill="#ffffff">Bring both confirmation pages</text>
    <text x="560" y="576" fill="#C6B0E8">Photo failed if</text>
    <text x="560" y="608" fill="#ffffff">The confirmation shows an X</text>
  </g>

  <text x="1060" y="196" fill="#ffffff" fill-opacity=".45" font-size="17" text-anchor="end">easyvisabooking.com</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img"
     aria-labelledby="cres-title cres-desc" font-family="Poppins, 'Segoe UI', Helvetica, Arial, sans-serif">
  <title id="cres-title">How many times you can reschedule a US visa appointment, by country</title>
  <desc id="cres-desc">Reschedule allowances per MRV fee differ sharply by country: India permits one change since 1 January 2025, the Philippines and Thailand three, and Japan six. Changes lock roughly 48 hours before the appointment.</desc>

  <defs>
    <linearGradient id="cres-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#00294A"/>
      <stop offset="55%" stop-color="#003A66"/>
      <stop offset="100%" stop-color="#004E86"/>
    </linearGradient>
    <linearGradient id="cres-fade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity=".10"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#cres-bg)"/>
  <rect width="1200" height="630" fill="url(#cres-fade)"/>

  <!-- eyebrow -->
  <text x="96" y="126" fill="#8FC4E8" font-size="22" font-weight="600" letter-spacing="3.4">RESCHEDULING TO AN EARLIER DATE</text>

  <!-- headline -->
  <text x="92" y="212" fill="#ffffff" font-size="66" font-weight="600" letter-spacing="-1.5">You get a fixed number</text>
  <text x="92" y="284" fill="#ffffff" font-size="66" font-weight="600" letter-spacing="-1.5">of tries. It depends</text>
  <text x="92" y="356" fill="#ffffff" font-size="66" font-weight="600" letter-spacing="-1.5">on where you apply.</text>
  <rect x="96" y="386" width="86" height="5" rx="2.5" fill="#E02454"/>

  <!-- country allowance cards -->
  <g>
    <g transform="translate(96 434)">
      <rect width="228" height="128" rx="12" fill="#ffffff" fill-opacity=".08" stroke="#ffffff" stroke-opacity=".22"/>
      <text x="24" y="52" fill="#ffffff" font-size="52" font-weight="600">1</text>
      <text x="64" y="52" fill="#9FCDEC" font-size="20" font-weight="500">reschedule</text>
      <text x="24" y="90" fill="#ffffff" font-size="24" font-weight="500">India</text>
      <text x="24" y="114" fill="#9FCDEC" font-size="16">since 1 Jan 2025</text>
    </g>
    <g transform="translate(348 434)">
      <rect width="228" height="128" rx="12" fill="#ffffff" fill-opacity=".08" stroke="#ffffff" stroke-opacity=".22"/>
      <text x="24" y="52" fill="#ffffff" font-size="52" font-weight="600">3</text>
      <text x="64" y="52" fill="#9FCDEC" font-size="20" font-weight="500">reschedules</text>
      <text x="24" y="90" fill="#ffffff" font-size="24" font-weight="500">Philippines</text>
      <text x="24" y="114" fill="#9FCDEC" font-size="16">Thailand also 3</text>
    </g>
    <g transform="translate(600 434)">
      <rect width="228" height="128" rx="12" fill="#ffffff" fill-opacity=".08" stroke="#ffffff" stroke-opacity=".22"/>
      <text x="24" y="52" fill="#ffffff" font-size="52" font-weight="600">6</text>
      <text x="64" y="52" fill="#9FCDEC" font-size="20" font-weight="500">reschedules</text>
      <text x="24" y="90" fill="#ffffff" font-size="24" font-weight="500">Japan</text>
      <text x="24" y="114" fill="#9FCDEC" font-size="16">most generous</text>
    </g>
    <g transform="translate(852 434)">
      <rect width="252" height="128" rx="12" fill="#E02454" fill-opacity=".16" stroke="#E02454" stroke-opacity=".55"/>
      <text x="24" y="52" fill="#ffffff" font-size="52" font-weight="600">0</text>
      <text x="64" y="52" fill="#F6A8BC" font-size="20" font-weight="500">changes</text>
      <text x="24" y="90" fill="#ffffff" font-size="24" font-weight="500">Inside ~48 hours</text>
      <text x="24" y="114" fill="#F6A8BC" font-size="16">the option locks</text>
    </g>
  </g>

  <!-- decorative arrow: later date moving earlier -->
  <g opacity=".5" transform="translate(852 150)">
    <rect x="0" y="0" width="252" height="196" rx="14" fill="none" stroke="#ffffff" stroke-opacity=".28" stroke-width="2"/>
    <path d="M0 48h252" stroke="#ffffff" stroke-opacity=".28" stroke-width="2"/>
    <g fill="#ffffff" fill-opacity=".22">
      <rect x="24" y="72" width="40" height="30" rx="5"/>
      <rect x="80" y="72" width="40" height="30" rx="5"/>
      <rect x="136" y="72" width="40" height="30" rx="5"/>
      <rect x="192" y="72" width="40" height="30" rx="5"/>
      <rect x="80" y="118" width="40" height="30" rx="5"/>
      <rect x="136" y="118" width="40" height="30" rx="5"/>
      <rect x="192" y="118" width="40" height="30" rx="5"/>
    </g>
    <rect x="192" y="72" width="40" height="30" rx="5" fill="#ffffff" fill-opacity=".45"/>
    <rect x="24" y="118" width="40" height="30" rx="5" fill="#E02454"/>
    <path d="M196 158 L60 158" stroke="#E02454" stroke-width="4" fill="none" stroke-linecap="round"/>
    <path d="M72 148 L58 158 L72 168" stroke="#E02454" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <text x="1104" y="600" fill="#ffffff" fill-opacity=".45" font-size="17" text-anchor="end">easyvisabooking.com</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img"
     aria-labelledby="cleg-title cleg-desc" font-family="Poppins, 'Segoe UI', Helvetica, Arial, sans-serif">
  <title id="cleg-title">Seven checks to run before paying any US visa appointment service</title>
  <desc id="cleg-desc">A checklist cover: pay only on success, data handling written down, no guarantee of a date or a visa, a written refund policy, a real contact channel, transparent pricing, and no pressure to decide.</desc>

  <defs>
    <linearGradient id="cleg-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#00294A"/>
      <stop offset="55%" stop-color="#003A66"/>
      <stop offset="100%" stop-color="#0A5C7A"/>
    </linearGradient>
    <linearGradient id="cleg-fade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity=".10"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#cleg-bg)"/>
  <rect width="1200" height="630" fill="url(#cleg-fade)"/>

  <!-- decorative shield, right -->
  <g transform="translate(852 150)" opacity=".16">
    <path d="M150 0 300 56v128c0 96-63 172-150 208C63 356 0 280 0 184V56Z" fill="none" stroke="#ffffff" stroke-width="3"/>
  </g>
  <g transform="translate(952 268)" opacity=".85">
    <path d="M0 34 26 60 76 8" fill="none" stroke="#7FD1A6" stroke-width="14" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- eyebrow -->
  <text x="96" y="132" fill="#8FC4E8" font-size="22" font-weight="600" letter-spacing="3.4">BEFORE YOU PAY ANYONE</text>

  <!-- headline -->
  <text x="92" y="222" fill="#ffffff" font-size="70" font-weight="600" letter-spacing="-1.5">7 checks that separate</text>
  <text x="92" y="298" fill="#ffffff" font-size="70" font-weight="600" letter-spacing="-1.5">a real service from</text>
  <text x="92" y="374" fill="#ffffff" font-size="70" font-weight="600" letter-spacing="-1.5">a costly mistake</text>
  <rect x="96" y="404" width="86" height="5" rx="2.5" fill="#E02454"/>

  <!-- checklist -->
  <g font-size="23" font-weight="500" fill="#ffffff">
    <g fill="none" stroke="#7FD1A6" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
      <path d="M98 464l12 12 22-24"/>
      <path d="M98 518l12 12 22-24"/>
      <path d="M98 572l12 12 22-24"/>
      <path d="M508 464l12 12 22-24"/>
      <path d="M508 518l12 12 22-24"/>
      <path d="M508 572l12 12 22-24"/>
    </g>
    <text x="152" y="480">Paid only if it works</text>
    <text x="152" y="534">Data handling in writing</text>
    <text x="152" y="588">Promises no date, ever</text>
    <text x="562" y="480">Refund terms in writing</text>
    <text x="562" y="534">A contact that answers</text>
    <text x="562" y="588">Price stated up front</text>
  </g>

  <text x="1104" y="112" fill="#ffffff" fill-opacity=".45" font-size="17" text-anchor="end">easyvisabooking.com</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img"
     aria-labelledby="cusvisaappointm-title cusvisaappointm-desc" font-family="Poppins, 'Segoe UI', Helvetica, Arial, sans-serif">
  <title id="cusvisaappointm-title">A group US visa booking moves as a unit, so a family needs several openings on one day rather than one</title>
  <desc id="cusvisaappointm-desc">Applicants grouped in a single scheduling account are moved together, so an earlier date requires enough openings on the same day for the whole group. Single cancellations, which are the main supply of earlier appointments at busy posts, rarely arrive in twos and threes. Every fee also multiplies: the application fee, the $250 visa integrity fee where it is collected, and the $750 expedite where it applies, are all charged per applicant.</desc>

  <defs>
    <linearGradient id="cusvisaappointm-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1E2340"/>
      <stop offset="55%" stop-color="#2C3566"/>
      <stop offset="100%" stop-color="#3D4B93"/>
    </linearGradient>
    <linearGradient id="cusvisaappointm-fade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity=".10"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#cusvisaappointm-bg)"/>
  <rect width="1200" height="630" fill="url(#cusvisaappointm-fade)"/>

  <text x="140" y="196" fill="#A9B6EC" font-size="22" font-weight="600" letter-spacing="3.2">ONE HARDER PROBLEM, NOT TWO</text>

  <text x="136" y="300" fill="#ffffff" font-size="66" font-weight="600" letter-spacing="-2">Four people means</text>
  <text x="136" y="364" fill="#ffffff" font-size="66" font-weight="600" letter-spacing="-2">four openings</text>
  <rect x="140" y="392" width="86" height="5" rx="2.5" fill="#E02454"/>

  <line x1="140" y1="452" x2="1060" y2="452" stroke="#ffffff" stroke-opacity=".18" stroke-width="1"/>
  <line x1="140" y1="544" x2="1060" y2="544" stroke="#ffffff" stroke-opacity=".18" stroke-width="1"/>

  <g font-size="21" font-weight="500">
    <text x="140" y="492" fill="#A9B6EC">Group bookings</text>
    <text x="140" y="524" fill="#ffffff">Move together, not individually</text>
    <text x="560" y="492" fill="#A9B6EC">What you need</text>
    <text x="560" y="524" fill="#ffffff">Adjacent slots, not one</text>
    <text x="140" y="576" fill="#A9B6EC">Every fee</text>
    <text x="140" y="608" fill="#ffffff">Charged per applicant</text>
    <text x="560" y="576" fill="#A9B6EC">Splitting a group</text>
    <text x="560" y="608" fill="#ffffff">A support request, not self-service</text>
  </g>

  <text x="1060" y="196" fill="#ffffff" fill-opacity=".45" font-size="17" text-anchor="end">easyvisabooking.com</text>
</svg>

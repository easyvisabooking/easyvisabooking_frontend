<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img"
     aria-labelledby="cusvisaappointm-title cusvisaappointm-desc" font-family="Poppins, 'Segoe UI', Helvetica, Arial, sans-serif">
  <title id="cusvisaappointm-title">A decision rule for whether paying for US visa appointment help is worth it</title>
  <desc id="cusvisaappointm-desc">Below about 90 days of queue at your post, the free routes are enough and nobody should be paying anyone. Between about 90 and 180 days it depends on how wide a range of dates you can accept and how much of your own time you can spend. Above about 180 days with a fixed deadline is where a paid option earns its place. The two genuinely free routes are working the calendar yourself and the expedited appointment request on documented urgency.</desc>

  <defs>
    <linearGradient id="cusvisaappointm-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#14322B"/>
      <stop offset="55%" stop-color="#1B4C3F"/>
      <stop offset="100%" stop-color="#236B55"/>
    </linearGradient>
    <linearGradient id="cusvisaappointm-fade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity=".10"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#cusvisaappointm-bg)"/>
  <rect width="1200" height="630" fill="url(#cusvisaappointm-fade)"/>

  <text x="140" y="196" fill="#95D8BE" font-size="22" font-weight="600" letter-spacing="3.2">THE ARITHMETIC, NOT THE PITCH</text>

  <text x="136" y="300" fill="#ffffff" font-size="76" font-weight="600" letter-spacing="-2">Under 90 days?</text>
  <text x="136" y="374" fill="#ffffff" font-size="76" font-weight="600" letter-spacing="-2">Pay nobody.</text>
  <rect x="140" y="402" width="86" height="5" rx="2.5" fill="#E02454"/>

  <line x1="140" y1="452" x2="1060" y2="452" stroke="#ffffff" stroke-opacity=".18" stroke-width="1"/>
  <line x1="140" y1="544" x2="1060" y2="544" stroke="#ffffff" stroke-opacity=".18" stroke-width="1"/>

  <g font-size="21" font-weight="500">
    <text x="140" y="492" fill="#95D8BE">Under 90 days</text>
    <text x="140" y="524" fill="#ffffff">Free routes are enough</text>
    <text x="560" y="492" fill="#95D8BE">90 to 180 days</text>
    <text x="560" y="524" fill="#ffffff">Depends on your flexibility</text>
    <text x="140" y="576" fill="#95D8BE">Over 180 days</text>
    <text x="140" y="608" fill="#ffffff">Where paying can pay off</text>
    <text x="560" y="576" fill="#95D8BE">Always free first</text>
    <text x="560" y="608" fill="#ffffff">The expedite request</text>
  </g>

  <text x="1060" y="196" fill="#ffffff" fill-opacity=".45" font-size="17" text-anchor="end">easyvisabooking.com</text>
</svg>

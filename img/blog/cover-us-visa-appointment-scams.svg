<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img"
     aria-labelledby="cusvisaappointm-title cusvisaappointm-desc" font-family="Poppins, 'Segoe UI', Helvetica, Arial, sans-serif">
  <title id="cusvisaappointm-title">When an intermediary breaks the scheduling rules, it is the applicant's appointment and account that are cancelled</title>
  <desc id="cusvisaappointm-desc">In March 2025 the US Mission in India cancelled about 2,000 visa appointments booked by automated means and suspended the scheduling privileges of the accounts involved. The applicants lost the appointment, the account and the money. The intermediaries who took the fee were not the ones sanctioned. The live 2026 scam patterns are advance-fee slot sales, fake demands for the $250 visa integrity fee, look-alike scheduling domains, and offers to sell the $750 expedite at posts where the pilot does not operate.</desc>

  <defs>
    <linearGradient id="cusvisaappointm-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#14322B"/>
      <stop offset="55%" stop-color="#1B4C3F"/>
      <stop offset="100%" stop-color="#236B55"/>
    </linearGradient>
    <linearGradient id="cusvisaappointm-fade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity=".10"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#cusvisaappointm-bg)"/>
  <rect width="1200" height="630" fill="url(#cusvisaappointm-fade)"/>

  <text x="140" y="196" fill="#95D8BE" font-size="22" font-weight="600" letter-spacing="3.2">THE APPLICANT CARRIES THE LOSS</text>

  <text x="136" y="300" fill="#ffffff" font-size="72" font-weight="600" letter-spacing="-2">2,000 appointments</text>
  <text x="136" y="370" fill="#ffffff" font-size="72" font-weight="600" letter-spacing="-2">cancelled</text>
  <rect x="140" y="398" width="86" height="5" rx="2.5" fill="#E02454"/>

  <line x1="140" y1="452" x2="1060" y2="452" stroke="#ffffff" stroke-opacity=".18" stroke-width="1"/>
  <line x1="140" y1="544" x2="1060" y2="544" stroke="#ffffff" stroke-opacity=".18" stroke-width="1"/>

  <g font-size="21" font-weight="500">
    <text x="140" y="492" fill="#95D8BE">Who gets sanctioned</text>
    <text x="140" y="524" fill="#ffffff">The applicant's account</text>
    <text x="560" y="492" fill="#95D8BE">Reported Telegram case</text>
    <text x="560" y="524" fill="#ffffff">Locked out after paying twice</text>
    <text x="140" y="576" fill="#95D8BE">Never asked for</text>
    <text x="140" y="608" fill="#ffffff">Your portal login</text>
    <text x="560" y="576" fill="#95D8BE">Never paid to</text>
    <text x="560" y="608" fill="#ffffff">A personal account</text>
  </g>

  <text x="1060" y="196" fill="#ffffff" fill-opacity=".45" font-size="17" text-anchor="end">easyvisabooking.com</text>
</svg>

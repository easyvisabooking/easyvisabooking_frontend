<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img"
     aria-labelledby="cusvisaappointm-title cusvisaappointm-desc" font-family="Poppins, 'Segoe UI', Helvetica, Arial, sans-serif">
  <title id="cusvisaappointm-title">The published US visa wait time measures the interview queue only, which is one of four stages</title>
  <desc id="cusvisaappointm-desc">Stage one is the DS-160 and the application fee, which takes days. Stage two is the interview queue, which ran from about 15 days at Abuja to about 495 days at Toronto in August 2026, and this is the only stage the published wait time measures. Stage three is the interview and the decision, which happens on one day. Stage four is administrative processing where it applies, plus passport return, and it is unpredictable and outside anyone's control.</desc>

  <defs>
    <linearGradient id="cusvisaappointm-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2C2237"/>
      <stop offset="55%" stop-color="#43305A"/>
      <stop offset="100%" stop-color="#5B4180"/>
    </linearGradient>
    <linearGradient id="cusvisaappointm-fade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity=".10"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#cusvisaappointm-bg)"/>
  <rect width="1200" height="630" fill="url(#cusvisaappointm-fade)"/>

  <text x="140" y="196" fill="#C6B0E8" font-size="22" font-weight="600" letter-spacing="3.2">FOUR STAGES, ONE PUBLISHED NUMBER</text>

  <text x="136" y="300" fill="#ffffff" font-size="66" font-weight="600" letter-spacing="-2">The wait time</text>
  <text x="136" y="364" fill="#ffffff" font-size="66" font-weight="600" letter-spacing="-2">covers stage two</text>
  <rect x="140" y="392" width="86" height="5" rx="2.5" fill="#E02454"/>

  <line x1="140" y1="452" x2="1060" y2="452" stroke="#ffffff" stroke-opacity=".18" stroke-width="1"/>
  <line x1="140" y1="544" x2="1060" y2="544" stroke="#ffffff" stroke-opacity=".18" stroke-width="1"/>

  <g font-size="21" font-weight="500">
    <text x="140" y="492" fill="#C6B0E8">Stage 1, form and fee</text>
    <text x="140" y="524" fill="#ffffff">Days</text>
    <text x="560" y="492" fill="#C6B0E8">Stage 2, the queue</text>
    <text x="560" y="524" fill="#ffffff">15 to 495 days by post</text>
    <text x="140" y="576" fill="#C6B0E8">Stage 3, the interview</text>
    <text x="140" y="608" fill="#ffffff">One day</text>
    <text x="560" y="576" fill="#C6B0E8">Stage 4, after</text>
    <text x="560" y="608" fill="#ffffff">Unpredictable</text>
  </g>

  <text x="1060" y="196" fill="#ffffff" fill-opacity=".45" font-size="17" text-anchor="end">easyvisabooking.com</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img"
     aria-labelledby="cusvisaappointm-title cusvisaappointm-desc" font-family="Poppins, 'Segoe UI', Helvetica, Arial, sans-serif">
  <title id="cusvisaappointm-title">A US visa interview within three months is routine at most posts and out of reach at about a dozen</title>
  <desc id="cusvisaappointm-desc">In August 2026 a visitor visa interview inside 90 days was the default at Abuja, Lagos, Recife, Rio de Janeiro, Porto Alegre, Perth, Kolkata, Nogales, Tijuana and Matamoros. It was not achievable at Toronto, Vancouver, Sydney, Hyderabad, Mumbai, New Delhi, Guadalajara or Bogota without a granted expedite request or, in Mexico and Canada, the $750 paid lane. The State Department publishes only B-1/B-2 averages where the next appointment is more than three months away, which makes three months a meaningful dividing line.</desc>

  <defs>
    <linearGradient id="cusvisaappointm-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1E2340"/>
      <stop offset="55%" stop-color="#2C3566"/>
      <stop offset="100%" stop-color="#3D4B93"/>
    </linearGradient>
    <linearGradient id="cusvisaappointm-fade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity=".10"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#cusvisaappointm-bg)"/>
  <rect width="1200" height="630" fill="url(#cusvisaappointm-fade)"/>

  <text x="140" y="196" fill="#A9B6EC" font-size="22" font-weight="600" letter-spacing="3.2">IT DEPENDS ENTIRELY ON YOUR POST</text>

  <text x="136" y="300" fill="#ffffff" font-size="58" font-weight="600" letter-spacing="-2">Routine at some.</text>
  <text x="136" y="356" fill="#ffffff" font-size="58" font-weight="600" letter-spacing="-2">Impossible at others.</text>
  <rect x="140" y="384" width="86" height="5" rx="2.5" fill="#E02454"/>

  <line x1="140" y1="452" x2="1060" y2="452" stroke="#ffffff" stroke-opacity=".18" stroke-width="1"/>
  <line x1="140" y1="544" x2="1060" y2="544" stroke="#ffffff" stroke-opacity=".18" stroke-width="1"/>

  <g font-size="21" font-weight="500">
    <text x="140" y="492" fill="#A9B6EC">Routine at</text>
    <text x="140" y="524" fill="#ffffff">Most posts worldwide</text>
    <text x="560" y="492" fill="#A9B6EC">Not achievable at</text>
    <text x="560" y="524" fill="#ffffff">About a dozen</text>
    <text x="140" y="576" fill="#A9B6EC">Free route if urgent</text>
    <text x="140" y="608" fill="#ffffff">The expedite request</text>
    <text x="560" y="576" fill="#A9B6EC">Paid route</text>
    <text x="560" y="608" fill="#ffffff">Mexico and Canada only</text>
  </g>

  <text x="1060" y="196" fill="#ffffff" fill-opacity=".45" font-size="17" text-anchor="end">easyvisabooking.com</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img"
     aria-labelledby="cusvisathirdcou-title cusvisathirdcou-desc" font-family="Poppins, 'Segoe UI', Helvetica, Arial, sans-serif">
  <title id="cusvisathirdcou-title">Third country US visa processing after the September 2025 guidance: still possible, no longer sensible</title>
  <desc id="cusvisathirdcou-desc">On 6 September 2025, updated 10 October 2025, the State Department directed nonimmigrant visa applicants to schedule at the post in their country of nationality or legal residence. It is guidance rather than a prohibition, and existing appointments were generally not cancelled, but applicants scheduling elsewhere are warned they may find it more difficult to qualify, and fees are neither refunded nor transferred. Applicants using their country of residence must be prepared to demonstrate it.</desc>

  <defs>
    <linearGradient id="cusvisathirdcou-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2C2237"/>
      <stop offset="55%" stop-color="#43305A"/>
      <stop offset="100%" stop-color="#5B4180"/>
    </linearGradient>
    <linearGradient id="cusvisathirdcou-fade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity=".10"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#cusvisathirdcou-bg)"/>
  <rect width="1200" height="630" fill="url(#cusvisathirdcou-fade)"/>

  <text x="140" y="196" fill="#C6B0E8" font-size="22" font-weight="600" letter-spacing="3.2">THIRD COUNTRY PROCESSING</text>

  <text x="136" y="300" fill="#ffffff" font-size="78" font-weight="600" letter-spacing="-2">Not banned.</text>
  <text x="136" y="376" fill="#ffffff" font-size="78" font-weight="600" letter-spacing="-2">Just a bad bet.</text>
  <rect x="140" y="404" width="86" height="5" rx="2.5" fill="#E02454"/>

  <line x1="140" y1="452" x2="1060" y2="452" stroke="#ffffff" stroke-opacity=".18" stroke-width="1"/>
  <line x1="140" y1="544" x2="1060" y2="544" stroke="#ffffff" stroke-opacity=".18" stroke-width="1"/>

  <g font-size="21" font-weight="500">
    <text x="140" y="492" fill="#C6B0E8">Announced</text>
    <text x="140" y="524" fill="#ffffff">6 September 2025</text>
    <text x="560" y="492" fill="#C6B0E8">Updated</text>
    <text x="560" y="524" fill="#ffffff">10 October 2025</text>
    <text x="140" y="576" fill="#C6B0E8">If it fails</text>
    <text x="140" y="608" fill="#ffffff">No refund, no transfer</text>
    <text x="560" y="576" fill="#C6B0E8">Outside it</text>
    <text x="560" y="608" fill="#ffffff">A, G, C-2, C-3, NATO</text>
  </g>

  <text x="1060" y="196" fill="#ffffff" fill-opacity=".45" font-size="17" text-anchor="end">easyvisabooking.com</text>
</svg>

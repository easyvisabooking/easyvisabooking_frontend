<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img"
     aria-labelledby="cwhathappenswhe-title cwhathappenswhe-desc" font-family="Poppins, 'Segoe UI', Helvetica, Arial, sans-serif">
  <title id="cwhathappenswhe-title">Rescheduling a US visa appointment changes the date, the confirmation and your remaining attempts, and nothing else</title>
  <desc id="cwhathappenswhe-desc">A reschedule moves the interview date, reissues the confirmation letter and decrements your remaining attempts. It does not touch the DS-160, the MRV fee receipt or its one year validity, and it has no effect on how the application is adjudicated. Where a country requires a separate biometrics appointment, that is a second booking with its own date, and scheduling it on the same day as the interview can cause the interview to be cancelled automatically.</desc>

  <defs>
    <linearGradient id="cwhathappenswhe-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1E2340"/>
      <stop offset="55%" stop-color="#2C3566"/>
      <stop offset="100%" stop-color="#3D4B93"/>
    </linearGradient>
    <linearGradient id="cwhathappenswhe-fade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity=".10"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#cwhathappenswhe-bg)"/>
  <rect width="1200" height="630" fill="url(#cwhathappenswhe-fade)"/>

  <text x="140" y="196" fill="#A9B6EC" font-size="22" font-weight="600" letter-spacing="3.2">STEP BY STEP</text>

  <text x="136" y="300" fill="#ffffff" font-size="62" font-weight="600" letter-spacing="-2">Three things change.</text>
  <text x="136" y="360" fill="#ffffff" font-size="62" font-weight="600" letter-spacing="-2">Four do not.</text>
  <rect x="140" y="388" width="86" height="5" rx="2.5" fill="#E02454"/>

  <line x1="140" y1="452" x2="1060" y2="452" stroke="#ffffff" stroke-opacity=".18" stroke-width="1"/>
  <line x1="140" y1="544" x2="1060" y2="544" stroke="#ffffff" stroke-opacity=".18" stroke-width="1"/>

  <g font-size="21" font-weight="500">
    <text x="140" y="492" fill="#A9B6EC">Changes</text>
    <text x="140" y="524" fill="#ffffff">Date, confirmation, attempts left</text>
    <text x="560" y="492" fill="#A9B6EC">Unchanged</text>
    <text x="560" y="524" fill="#ffffff">DS-160 and MRV receipt</text>
    <text x="140" y="576" fill="#A9B6EC">Old slot</text>
    <text x="140" y="608" fill="#ffffff">Returns to the pool immediately</text>
    <text x="560" y="576" fill="#A9B6EC">Biometrics</text>
    <text x="560" y="608" fill="#ffffff">Must be at least a day earlier</text>
  </g>

  <text x="1060" y="196" fill="#ffffff" fill-opacity=".45" font-size="17" text-anchor="end">easyvisabooking.com</text>
</svg>

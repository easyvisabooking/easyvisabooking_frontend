<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img"
     aria-labelledby="cwhattobringusv-title cwhattobringusv-desc" font-family="Poppins, 'Segoe UI', Helvetica, Arial, sans-serif">
  <title id="cwhattobringusv-title">US consulates prohibit electronics and large bags at the door and provide no facility to store them</title>
  <desc id="cwhattobringusv-desc">Battery-operated and electronic devices including mobile phones, smart watches, cameras, laptops, tablets and flash drives are not permitted at US embassies and consulates for visa interviews. Large bags, backpacks, briefcases and suitcases are prohibited, with only hand-carried folders of application papers allowed. There is no storage facility at the building or the visa application centre, and arriving with prohibited items can mean being refused entry and having the appointment cancelled.</desc>

  <defs>
    <linearGradient id="cwhattobringusv-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2C2237"/>
      <stop offset="55%" stop-color="#43305A"/>
      <stop offset="100%" stop-color="#5B4180"/>
    </linearGradient>
    <linearGradient id="cwhattobringusv-fade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity=".10"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#cwhattobringusv-bg)"/>
  <rect width="1200" height="630" fill="url(#cwhattobringusv-fade)"/>

  <text x="140" y="196" fill="#C6B0E8" font-size="22" font-weight="600" letter-spacing="3.2">THE DOOR, NOT THE INTERVIEW</text>

  <text x="136" y="300" fill="#ffffff" font-size="58" font-weight="600" letter-spacing="-2">No phone. No bag.</text>
  <text x="136" y="356" fill="#ffffff" font-size="58" font-weight="600" letter-spacing="-2">No storage.</text>
  <rect x="140" y="384" width="86" height="5" rx="2.5" fill="#E02454"/>

  <line x1="140" y1="452" x2="1060" y2="452" stroke="#ffffff" stroke-opacity=".18" stroke-width="1"/>
  <line x1="140" y1="544" x2="1060" y2="544" stroke="#ffffff" stroke-opacity=".18" stroke-width="1"/>

  <g font-size="21" font-weight="500">
    <text x="140" y="492" fill="#C6B0E8">Not permitted</text>
    <text x="140" y="524" fill="#ffffff">Phones, watches, laptops, drives</text>
    <text x="560" y="492" fill="#C6B0E8">Not permitted</text>
    <text x="560" y="524" fill="#ffffff">Backpacks, briefcases, suitcases</text>
    <text x="140" y="576" fill="#C6B0E8">Storage on site</text>
    <text x="140" y="608" fill="#ffffff">None. Arrange it beforehand</text>
    <text x="560" y="576" fill="#C6B0E8">Consequence</text>
    <text x="560" y="608" fill="#ffffff">Refused entry, appointment lost</text>
  </g>

  <text x="1060" y="196" fill="#ffffff" fill-opacity=".45" font-size="17" text-anchor="end">easyvisabooking.com</text>
</svg>
